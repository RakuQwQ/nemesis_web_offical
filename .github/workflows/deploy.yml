name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main   # change to "master" if your default branch is master
  workflow_dispatch: # allow manual runs from the Actions tab

# Sets permissions for the GITHUB_TOKEN to allow GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Only allow one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        # SITE_BASE_PATH should match your GitHub Pages URL subpath.
        # For a project page at https://<user>.github.io/<repo>/ set it to /<repo>/
        # For a custom domain (e.g. https://nemesis.wiki/) leave this line out or set to /
        # You can also override this via a repository secret called SITE_BASE_PATH.
        env:
          SITE_BASE_PATH: ${{ secrets.SITE_BASE_PATH || '/' }}
        run: pnpm vite build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://www.nemesis.wiki
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
