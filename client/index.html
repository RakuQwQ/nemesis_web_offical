<!doctype html>
<html lang="zh-Hant">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>NEMESIS</title>
    <link rel="icon" type="image/png" href="/img/serphan_logo.png" />
    <meta name="description" content="NEMESIS 香港 Minecraft 公會 — 香港最具規模的 Minecraft 社群，為你服務。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Noto+Sans+HK:wght@300;400;500;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Analytics: to enable, add VITE_ANALYTICS_ENDPOINT and VITE_ANALYTICS_WEBSITE_ID as repo secrets
         and add the umami script tag here using those values. -->
    <!-- GitHub Pages SPA: decode redirect path set by 404.html -->
    <script>
      (function () {
        var redirect = sessionStorage.getItem('spa-redirect');
        if (redirect) {
          sessionStorage.removeItem('spa-redirect');
          window.history.replaceState(null, '', redirect);
        }
      })();
    </script>
  </body>

</html>
